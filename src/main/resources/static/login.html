<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống QLSK</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .auth-container {
            max-width: 440px;
            margin: 4rem auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            padding: 3rem 2.5rem;
            opacity: 0;
            transform: translateY(30px);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .input-wrapper {
            position: relative;
        }
        .form-control {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background: #f8fafc;
        }
        .form-control:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .input-icon {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .form-control:focus + .input-icon {
            color: var(--primary);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .auth-icon {
            width: 64px;
            height: 64px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <span class="brand-badge"><i class="fa-solid fa-ticket"></i> QLSK</span>
                EventHub Pro
            </a>
            <div id="nav-auth" class="nav-auth"></div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container gs-reveal">
            <div class="auth-header">
                <div class="auth-icon"><i class="fa-solid fa-user-lock"></i></div>
                <h2 style="font-size:1.85rem; font-weight:800; margin-bottom:0.5rem; color:var(--text-primary);">Đăng Nhập</h2>
                <p style="color:var(--text-secondary); font-size:0.95rem;">
                    Hệ thống Quản lý Sự kiện & Kiểm soát Tham dự
                </p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập hoặc Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="Nhập username hoặc email" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:0.9rem; margin-top:1rem; font-size:1.05rem;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập
                </button>
            </form>

            <div style="text-align:center; margin-top:2rem; font-size:0.95rem; color:var(--text-secondary);">
                Chưa có tài khoản? <a href="/register.html" style="color:var(--primary); font-weight:700; text-decoration:none; margin-left:0.25rem;">Đăng ký ngay <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // GSAP Animation
        gsap.to(".gs-reveal", { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.2)", delay: 0.1 });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';

                const res = await apiCall('/auth/login', 'POST', {
                    usernameOrEmail: username,
                    password: password
                });

                saveAuth(res.accessToken, {
                    id: res.userId,
                    username: res.username,
                    fullName: res.fullName,
                    email: res.email,
                    role: res.role
                });

                showToast('Đăng nhập thành công!', 'success');

                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');
                    if (redirect) {
                        window.location.href = redirect;
                    } else if (res.role === 'ROLE_ADMIN') {
                        window.location.href = '/admin/index.html';
                    } else if (res.role === 'ROLE_ORGANIZER') {
                        window.location.href = '/organizer/index.html';
                    } else {
                        window.location.href = '/';
                    }
                }, 800);

            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === 'true') {
                showToast('Phiên đăng nhập trước đó đã hết hạn. Vui lòng đăng nhập lại.', 'info');
            }
        });
    </script>
</body>
</html>
