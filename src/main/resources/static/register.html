<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Hệ Thống QLSK</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 3rem auto;
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-xl);
            padding: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            outline: none;
        }
        .form-control:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <span class="brand-badge">QLSK</span>
                EventHub Pro
            </a>
            <div id="nav-auth" class="nav-auth"></div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2 style="font-size:1.75rem; font-weight:800; margin-bottom:0.5rem; text-align:center;">Đăng Ký Thành Viên</h2>
            <p style="color:var(--text-secondary); font-size:0.9rem; text-align:center; margin-bottom:1.75rem;">
                Tạo tài khoản để đăng ký tham gia các sự kiện hấp dẫn
            </p>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Từ 3-50 ký tự" required>
                </div>
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" class="form-control" placeholder="09xxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:0.8rem; margin-top:0.5rem;">
                    Hoàn Tất Đăng Ký
                </button>
            </form>

            <div style="text-align:center; margin-top:1.25rem; font-size:0.9rem;">
                Đã có tài khoản? <a href="/login.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            try {
                btn.disabled = true;
                btn.textContent = 'Đang tạo tài khoản...';

                await apiCall('/auth/register', 'POST', {
                    fullName, username, email, phone, password
                });

                showToast('Đăng ký thành công! Đang chuyển hướng đăng nhập...', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);

            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Hoàn Tất Đăng Ký';
            }
        });
    </script>
</body>
</html>
