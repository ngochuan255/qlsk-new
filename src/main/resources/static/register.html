<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Hệ Thống QLSK</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .auth-container {
            max-width: 480px;
            margin: 3rem auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            padding: 2.5rem 2.5rem;
            opacity: 0;
            transform: translateY(30px);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .input-wrapper {
            position: relative;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
            background: #f8fafc;
        }
        .form-control:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .input-icon {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            transition: color 0.3s;
        }
        .form-control:focus + .input-icon {
            color: var(--primary);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <span class="brand-badge"><i class="fa-solid fa-ticket"></i> QLSK</span>
                EventHub Pro
            </a>
            <div id="nav-auth" class="nav-auth"></div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container gs-reveal">
            <div class="auth-header">
                <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
                <h2 style="font-size:1.75rem; font-weight:800; margin-bottom:0.5rem; color:var(--text-primary);">Đăng Ký Thành Viên</h2>
                <p style="color:var(--text-secondary); font-size:0.9rem;">
                    Tạo tài khoản để đăng ký tham gia các sự kiện hấp dẫn
                </p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="Từ 3-50 ký tự" required>
                        <i class="fa-solid fa-id-badge input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" class="form-control" placeholder="09xxxxxxxx">
                        <i class="fa-solid fa-phone input-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:0.9rem; margin-top:0.5rem; font-size:1.05rem;">
                    <i class="fa-solid fa-check-circle"></i> Hoàn Tất Đăng Ký
                </button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; font-size:0.95rem; color:var(--text-secondary);">
                Đã có tài khoản? <a href="/login.html" style="color:var(--primary); font-weight:700; text-decoration:none; margin-left:0.25rem;">Đăng nhập ngay <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        gsap.to(".gs-reveal", { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.2)", delay: 0.1 });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo tài khoản...';

                await apiCall('/auth/register', 'POST', {
                    fullName, username, email, phone, password
                });

                showToast('Đăng ký thành công! Đang chuyển hướng...', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);

            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Hoàn Tất Đăng Ký';
            }
        });
    </script>
</body>
</html>
