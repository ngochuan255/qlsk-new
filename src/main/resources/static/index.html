<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Sự Kiện & Kiểm Soát Tham Dự (QLSK)</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .hero {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            color: #ffffff;
            padding: 4rem 1.5rem;
            text-align: center;
            border-radius: var(--radius-lg);
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-xl);
        }

        .hero h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1.15rem;
            color: #c7d2fe;
            max-width: 680px;
            margin: 0 auto 2rem;
        }

        .search-box {
            background: #ffffff;
            padding: 1rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            max-width: 860px;
            margin: 0 auto;
        }

        .search-input {
            flex: 2;
            min-width: 200px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
        }

        .search-select {
            flex: 1;
            min-width: 150px;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #ffffff;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.75rem;
        }

        .event-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }

        .event-banner {
            height: 180px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .event-badge-status {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
        }

        .event-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 0.75rem;
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .event-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <span class="brand-badge">QLSK</span>
                EventHub Pro
            </a>
            <div id="nav-auth" class="nav-auth"></div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <!-- HERO SECTION -->
        <section class="hero">
            <h1>Khám Phá & Đăng Ký Sự Kiện</h1>
            <p>Hệ thống tổ chức sự kiện chuyên nghiệp, quản lý sơ đồ chỗ ngồi thông minh và kiểm soát vé vào cửa bằng mã
                QR hiện đại.</p>

            <!-- SEARCH / FILTER BAR -->
            <form id="search-form" class="search-box">
                <input type="text" id="keyword" class="search-input" placeholder="Tìm theo tên sự kiện, địa điểm...">
                <select id="category-select" class="search-select">
                    <option value="">Tất cả danh mục</option>
                </select>
                <select id="status-select" class="search-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="OPEN_FOR_REGISTRATION">Đang mở đăng ký</option>
                    <option value="FULL">Đã đủ chỗ</option>
                    <option value="ONGOING">Đang diễn ra</option>
                    <option value="COMPLETED">Đã kết thúc</option>
                </select>
                <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            </form>
        </section>

        <!-- EVENT LIST SECTION -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h2 style="font-size:1.5rem; font-weight:800;">Sự Kiện Nổi Bật</h2>
            <span id="events-count" style="font-size:0.9rem; color:var(--text-secondary);"></span>
        </div>

        <div id="events-grid" class="events-grid">
            <p style="text-align:center; grid-column:1/-1; color:var(--text-muted); padding:3rem;">Đang tải danh sách sự
                kiện...</p>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Hệ Thống Quản Lý Tổ Chức Sự Kiện và Kiểm Soát Tham Dự - QLSK System.</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js?v=6"></script>
    <script>
        async function loadCategories() {
            try {
                const cats = await apiCall('/categories');
                const select = document.getElementById('category-select');
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error loading categories', e);
            }
        }

        async function loadEvents() {
            const keyword = document.getElementById('keyword').value.trim();
            const categoryId = document.getElementById('category-select').value;
            const status = document.getElementById('status-select').value;

            let query = '/events/public?';
            if (keyword) query += `keyword=${encodeURIComponent(keyword)}&`;
            if (categoryId) query += `categoryId=${categoryId}&`;
            if (status) query += `status=${status}&`;

            const grid = document.getElementById('events-grid');
            try {
                const events = await apiCall(query);
                document.getElementById('events-count').textContent = `Hiển thị ${events.length} sự kiện`;

                if (events.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted); padding:3rem;">Không tìm thấy sự kiện phù hợp.</p>';
                    return;
                }

                grid.innerHTML = events.map(evt => {
                    const badgeClass = evt.status === 'OPEN_FOR_REGISTRATION' ? 'badge-open' :
                        evt.status === 'FULL' ? 'badge-full' :
                            evt.status === 'ONGOING' ? 'badge-ongoing' : 'badge-completed';

                    const bannerContent = evt.bannerUrl
                        ? `<img src="${evt.bannerUrl}" alt="" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;">`
                        : '🎟️';

                    return `
                        <div class="event-card">
                            <div class="event-banner">
                                ${bannerContent}
                                <span class="badge ${badgeClass} event-badge-status">${evt.statusText}</span>
                            </div>
                            <div class="event-content">
                                <span style="font-size:0.8rem; font-weight:700; color:var(--primary); text-transform:uppercase;">
                                    ${evt.categoryName}
                                </span>
                                <h3 class="event-title">${evt.title}</h3>
                                <div class="event-meta">
                                    <div>📍 ${evt.location}</div>
                                    <div>⏰ ${formatDateTime(evt.startTime)}</div>
                                    <div>👥 Còn ${evt.remainingSeats} / ${evt.maxAttendees} chỗ</div>
                                    <div>⭐ ${evt.averageRating > 0 ? evt.averageRating + ' / 5 (' + evt.feedbackCount + ' đánh giá)' : 'Chưa có đánh giá'}</div>
                                </div>
                                <div class="event-footer">
                                    <span style="font-size:0.85rem; color:var(--text-secondary);">BTC: ${evt.organizerName}</span>
                                    <a href="/event-detail.html?id=${evt.id}" class="btn btn-primary btn-sm">Xem chi tiết</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--danger); padding:3rem;">Lỗi tải dữ liệu: ${err.message}</p>`;
            }
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            loadEvents();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadEvents();
        });
    </script>
</body>

</html>
