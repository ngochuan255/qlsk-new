server.port=8080
spring.application.name=qlsk-system

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/qlsk_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=ngochuan123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart / File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d
app.jwt.expiration-ms=86400000

# QR Code Configuration
app.qr.width=300
app.qr.height=300

# Sample Data Configuration (false = không tự động tạo lại 3 tài khoản mặc định khi khởi động)
app.init-sample-data=false
